# Two small oauth2-proxy instances, not one -- oauth2-proxy is built around
# one upstream per instance, so a single instance can't cleanly front both
# Tyche and the Homer landing page. Both share the same allowlist file and
# cookie secret so a login on one carries over to the other (--cookie-domain
# scopes the session cookie to the whole project-aegis.io zone).
#
# Onboarding/removing an allowed person: edit ./authenticated-emails.txt on
# this host (never committed to git, never baked into an image), then
# `docker compose restart` -- a few seconds, no impact on Tyche's own
# backend/frontend/db stack at all.
services:
  oauth2-proxy-tyche:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    container_name: oauth2-proxy-tyche
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OAUTH2_PROXY_PROVIDER=google
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_UPSTREAMS=https://frontend:443
      - OAUTH2_PROXY_SSL_UPSTREAM_INSECURE_SKIP_VERIFY=true
      # frontend terminates its own TLS with a mkcert cert for tyche.local,
      # not tyche.project-aegis.io -- there's only one server{} block in its
      # nginx config, so it serves regardless of Host header, but the cert
      # itself will never hostname-match what we're proxying as. Skipping
      # upstream verification here is the same trust model NPM's own
      # "ignore invalid SSL" already uses proxying to this exact container
      # today -- not a new risk introduced by this service.
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE=/config/authenticated-emails.txt
      - OAUTH2_PROXY_COOKIE_NAME=_oauth2_proxy_aegis
      - OAUTH2_PROXY_COOKIE_DOMAINS=.project-aegis.io
      - OAUTH2_PROXY_WHITELIST_DOMAINS=.project-aegis.io
      - OAUTH2_PROXY_COOKIE_EXPIRE=504h
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_HTTPONLY=true
      - OAUTH2_PROXY_REDIRECT_URL=https://tyche.project-aegis.io/oauth2/callback
      - OAUTH2_PROXY_REVERSE_PROXY=true
      # OAUTH2_PROXY_CLIENT_ID / _CLIENT_SECRET / _COOKIE_SECRET come from .env
      # (gitignored) -- never hardcode secrets here.
      # No --skip-auth-route / --skip-auth-regex, ever -- any such exception
      # reopens the unauthenticated-bypass path this whole build exists to close.
    volumes:
      - ./authenticated-emails.txt:/config/authenticated-emails.txt:ro
    networks:
      - proxy-net
      - finance-net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  oauth2-proxy-homer:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    container_name: oauth2-proxy-homer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OAUTH2_PROXY_PROVIDER=google
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_UPSTREAMS=http://homer:8080
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE=/config/authenticated-emails.txt
      - OAUTH2_PROXY_COOKIE_NAME=_oauth2_proxy_aegis
      - OAUTH2_PROXY_COOKIE_DOMAINS=.project-aegis.io
      - OAUTH2_PROXY_WHITELIST_DOMAINS=.project-aegis.io
      - OAUTH2_PROXY_COOKIE_EXPIRE=504h
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_HTTPONLY=true
      - OAUTH2_PROXY_REDIRECT_URL=https://project-aegis.io/oauth2/callback
      - OAUTH2_PROXY_REVERSE_PROXY=true
      # Same CLIENT_ID / CLIENT_SECRET / COOKIE_SECRET as oauth2-proxy-tyche
      # (from .env) -- the shared cookie secret + shared cookie domain is
      # what makes one login cover both entry points.
    volumes:
      - ./authenticated-emails.txt:/config/authenticated-emails.txt:ro
    networks:
      - proxy-net
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  proxy-net:
    external: true
  finance-net:
    external: true
    name: finance-hub_finance-net
